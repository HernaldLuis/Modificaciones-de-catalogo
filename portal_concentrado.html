<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Portal de Concentrado · API</title>
<style>
:root{--bg:#0b132b;--card:#0f172a;--muted:#94a3b8;--prim:#22c55e;--sec:#0ea5e9;--txt:#e5e7eb;}
*{box-sizing:border-box;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto}
body{margin:0;background:linear-gradient(180deg,#0b132b,#0b132b 60%,#0a0f24);color:var(--txt);}
.header{position:sticky;top:0;z-index:5;padding:14px 16px;background:linear-gradient(90deg,rgba(34,197,94,.15),rgba(14,165,233,.15));border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:clamp(18px,2.6vw,24px);}
.badge{display:inline-flex;gap:8px;align-items:center;background:#0a0f24;border:1px solid rgba(255,255,255,.08);padding:8px 12px;border-radius:999px;font-weight:800;color:#cbd5e1}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.card{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.25);padding:14px}
.card h3{margin:0 0 10px;font-size:1rem;color:#cbd5e1}
.kpi{display:flex;align-items:center;justify-content:space-between}
.kpi .num{font-size:1.6rem;font-weight:900}
.kpi .tag{font-size:.85rem;color:var(--muted)}
.controls{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer;background:#1f2937;color:#e5e7eb}
button:hover,.btn:hover{filter:brightness(1.1)}
.btn-prim{background:var(--prim);color:#06202a} .btn-sec{background:var(--sec);color:#06202a}
select,input[type="text"]{background:#0a0f24;border:1px solid #1f2937;color:#e5e7eb;border-radius:10px;padding:9px 12px}
.table{overflow:auto;border-radius:12px;border:1px solid rgba(255,255,255,.08)}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;background:#0a0f24;color:#cbd5e1;text-align:left;padding:10px;font-size:.9rem;border-bottom:1px solid #1f2937}
tbody td{padding:10px;border-top:1px solid #0f172a;font-size:.92rem;color:#e5e7eb}
tfoot td{padding:10px;border-top:2px solid #1f2937;font-weight:900}
.empty{padding:16px;color:#94a3b8}
.toast{position:fixed;bottom:20px;right:20px;background:#111827;color:white;padding:10px 14px;border-radius:10px;display:none;z-index:1200}
.footer{padding:18px;color:#94a3b8;font-size:.9rem;text-align:center}
@media (max-width:900px){.grid{grid-template-columns:repeat(6,1fr)}}
@media (max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
  <div class="header">
    <h1>Portal de Concentrado · Conectado a Apps Script</h1>
    <div class="controls">
      <span class="badge">API</span>
      <button id="btnRefrescar" class="btn">🔄 Refrescar</button>
      <button id="btnCSV" class="btn">⬇️ Exportar CSV</button>
      <button id="btnPDF" class="btn">🖨️ Imprimir</button>
    </div>
  </div>

  <div class="wrap">
    <div class="grid">
      <div class="card kpi col" style="grid-column:span 3;">
        <div><div class="tag">Habitaciones registradas</div><div id="kpiTotal" class="num">0</div></div><div>🏨</div>
      </div>
      <div class="card kpi col" style="grid-column:span 3;">
        <div><div class="tag">OK</div><div id="kpiOK" class="num">0</div></div><div>✅</div>
      </div>
      <div class="card kpi col" style="grid-column:span 3;">
        <div><div class="tag">Pendientes</div><div id="kpiPend" class="num">0</div></div><div>⏳</div>
      </div>
      <div class="card kpi col" style="grid-column:span 3;">
        <div><div class="tag">Última actualización</div><div id="kpiUltima" class="num">—</div></div><div>🕒</div>
      </div>

      <div class="card" style="grid-column:span 12;">
        <h3>Concentrado</h3>
        <div class="table">
          <table id="tabla">
            <thead>
              <tr>
                <th>Habitación</th>
                <th>Usuario</th>
                <th>Estado</th>
                <th>Anomalías</th>
                <th>Cama</th>
                <th>Baño</th>
                <th>Fecha</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <tr><td colspan="7" class="empty">Cargando desde la API…</td></tr>
            </tbody>
            <tfoot><tr><td colspan="7" id="resumen">K: 0 · D: 0 · Pendientes: 0 · Total: 0</td></tr></tfoot>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <div class="footer">Paradisus · API centralizada</div>

<script>
/** CONFIG **/
const API_URL = "https://script.google.com/macros/s/AKfycbz-jh6y0UwfLtiQgOuPP3Wubm7SIlQich_T0iSigy7l8at04Zq4wGo2hsXZu_ZaW6sftw/exec";
const TOKEN   = "PARADISUS_INV_2025_xX7$K9"; // la app codifica %24 en GET automáticamente

/** UTILS **/
const $ = (s)=>document.querySelector(s);
const toast=(t)=>{const el=$("#toast"); el.textContent=t; el.style.display="block"; setTimeout(()=>el.style.display="none",2400);};
const fmt = d => d ? new Intl.DateTimeFormat('es-MX',{dateStyle:'medium', timeStyle:'short'}).format(new Date(d)) : '';

function mapRow(it){
  return {
    habitacion: it.habitacion || '',
    usuario: it.usuario || '',
    estado: it.estado || '',
    anomalias: it.anomalias || '',
    cama: it['cama.tipo'] || '',
    bano: `${it['bano.categoria']||''}${it['bano.verdes']!=null?` (verdes: ${it['bano.verdes']})`:''}`,
    fecha: it.fecha || it.created_at || it.fecha_servidor || ''
  };
}

function pintar(arr){
  const tb = $("#tbody");
  if(!arr.length){ tb.innerHTML='<tr><td colspan="7" class="empty">Sin datos.</td></tr>'; return; }
  tb.innerHTML = arr.map(r => `
    <tr>
      <td>${r.habitacion}</td>
      <td>${r.usuario}</td>
      <td>${r.estado}</td>
      <td>${r.anomalias}</td>
      <td>${r.cama}</td>
      <td>${r.bano}</td>
      <td>${fmt(r.fecha)}</td>
    </tr>
  `).join('');
}

function kpis(arr){
  const total = arr.length;
  const ok = arr.filter(x=>String(x.estado).toUpperCase()==='OK').length;
  const pend = total - ok;
  $("#kpiTotal").textContent = total;
  $("#kpiOK").textContent = ok;
  $("#kpiPend").textContent = pend;
  const fechas = arr.map(x=>x.fecha).filter(Boolean).sort();
  $("#kpiUltima").textContent = fechas.length ? fmt(fechas[fechas.length-1]) : "—";
  const cont = arr.reduce((a,x)=>{ if(x.cama==='K') a.K++; else if(x.cama==='D') a.D++; a.T++; return a; }, {K:0,D:0,T:0});
  $("#resumen").textContent = `K: ${cont.K} · D: ${cont.D} · Pendientes: ${pend} · Total: ${cont.T}`;
}

async function cargar(){
  try{
    const url = `${API_URL}?token=${encodeURIComponent(TOKEN)}`;
    const res = await fetch(url);
    const json = await res.json();
    if (json.status !== 'ok') throw new Error(json.error || 'Error de API');
    const items = (json.rows || []).map(mapRow);
    pintar(items); kpis(items);
    toast("Datos desde API cargados");
  }catch(e){ console.error(e); toast("Error al leer API"); }
}

function exportCSV(){
  const rows = [...document.querySelectorAll('#tbody tr')].map(tr=>[...tr.children].map(td=>td.textContent));
  if(!rows.length || rows[0].length!==7){ toast('Nada para exportar'); return; }
  const headers = ["habitacion","usuario","estado","anomalias","cama","bano","fecha"];
  const csv = [headers.join(","), ...rows.map(r=>r.map(x=>`"${x.replace(/"/g,'""')}"`).join(","))].join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "concentrado.csv"; a.click(); URL.revokeObjectURL(a.href);
}

document.getElementById('btnRefrescar').addEventListener('click', cargar);
document.getElementById('btnCSV').addEventListener('click', exportCSV);
document.getElementById('btnPDF').addEventListener('click', ()=> window.print());

// bootstrap
cargar();
</script>
</body>
</html>
